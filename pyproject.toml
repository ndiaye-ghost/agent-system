[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-agent"
version = "0.1.0"
description = "Assistant IA pour l'AMDEC et les exigences de sécurité ISO 26262, avec modèle hébergé"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "openpyxl>=3.1"]

[project.scripts]
safety-agent = "safety_agent.cli:main"

[tool.setuptools.packages.find]
include = ["safety_agent*"]
